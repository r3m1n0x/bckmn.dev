{{ if eq (.Get "compact") "true" }}
<ul class="certifications-compact">
  {{ range hugo.Data.certifications }}
  <li><strong>{{ upper .id }}</strong> — {{ .name }}</li>
  {{ end }}
</ul>
{{ else }}
<ul class="certifications" role="list">
  {{ range hugo.Data.certifications }}
  <li class="certification">
    <img src="{{ printf "images/certifications/%s.svg" .id | relURL }}" alt="" width="144" height="144" decoding="async">
    <div class="certification-copy">
      <h3>{{ upper .id }}</h3>
      <p class="certification-name">{{ .name }}</p>
      <a href="{{ .url }}" aria-label="{{ upper .id }} certification details at the Linux Foundation">Certification details <span aria-hidden="true">↗</span></a>
    </div>
  </li>
  {{ end }}
</ul>
{{ end }}
